name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  go_router: ^17.0.1
  google_fonts: ^6.3.3
  provider: ^6.1.5+1
  url_launcher: ^6.2.5
  image_picker: ^1.2.1
  supabase_flutter: ^2.12.0
  path: ^1.9.1
  # مكتبة قراءة رقم الإصدار برمجياً
  package_info_plus: ^8.0.0 
  fl_chart: ^1.1.1
  uuid: ^4.5.2
  google_generative_ai: ^0.4.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # مكتبة توليد أيقونات التطبيق
  flutter_launcher_icons: ^0.13.1

# إعدادات أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png" # تأكد من وجود صورة بهذا المسار أو غيره لمسار صورتك

flutter:
  assets:
    - assets/images/
  uses-material-design: true